<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sino Yoga Newsletter</title>

<link rel="stylesheet" href="styles.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>
  <div class="newsletter">
     <div class="icon-header">
          <div class="icon-circle">✉</div>
          <div class="icon-text">
            <h2> Sign up for the Sino Yoga Monthly Newseltter</h2>
            <p> Get wellness tips, exclusive content, video updates, and special offers.</p>
          </div>
      </div>
    <form id="newsletterform">
        <label>First Name<span class="required">*</span></label>
        <input name="firstName" type="text" placeholder="Enter your First Name" required>
        <label>Last Name<span class="required">*</span></label>
        <input name="lastName" type="text" placeholder="Enter your Last Name" required>
        <br>
        <label>Email<span class="required">*</span></label>
        <input name ="email" type="email" placeholder="Enter your Email" required>

        <div class="form-row">
            <div>
                <label>Preferred Language<span class="required">*</span></label>
                <select name="language" required>
                    <option value="">Select language</option>
                    <option>English</option>
                    <option>Chinese</option>
                </select>
            </div>
            <div>
                <label>Age<span class="required">*</span></label>
                <select name="age" required>
                    <option value="">Select age range</option>
                    <option>Under 18</option>
                    <option>18-24</option>
                    <option>25-34</option>
                    <option>35-44</option>
                    <option>45+</option>
                </select>
             </div>
          </div>
      <div class="form-row">
      <div>
        <label>Gender<span class="required">*</span></label>
        <select name="gender" required>
            <option value="">Select gender</option>
            <option>Female</option>
            <option>Male</option>
            <option>Other</option>
            <option>Prefer not to say</option>
        </select>
      </div>
        <div>
        <label>Yoga Experience<span class="required">*</span></label>
        <select name="experience" required>
          <option value="">Select your level</option>
          <option>Beginner</option>
          <option>Intermediate</option>
          <option>Advanced</option>
        </select>
      </div>
        <div class="membership-field">
         <label>Are you interested in our YouTube Membership?<span class="required">*</span></label>
            <select name="membership" required>
             <option value="">Membership</option>
             <option value="yes">Yes</option>
             <option value="no">No</option>
             <option value="maybe">Maybe</option>
            </select>
    </div> 
</div>
   <button type="submit">Subscribe Now</button>
    <p class="privacy">🔒 We respect your privacy. Unsubscribe at any time.</p> 
    <p id="formMessage"></p>
  </form>
  </div>
  <script src="script.js"></script>
  
  <div class="social-platforms">
    <h2>Follow Sino Yoga</h2>
    <p>Join our community for weekly practices, wellness tips, and live events.</p>

    <div class= "social-links">
      <a href="https://www.youtube.com/@Sinoyoga" target= "_blank">
        <button class="social-btn">
          <img src="images/youtube-logo.png" alt="YouTube">
        </button>
      </a>
      <a href="https://www.instagram.com/yogayang_/?hl=en" target= "_blank">
        <button class="social-btn">
          <img src="images/instagram-logo.png" alt="Instagram">
        </button>
      </a>
      <a href="https://www.facebook.com/groups/sinoyoga" target= "_blank">
        <button class="social-btn">
          <img src="images/facebook-logo.png" alt="Facebook">
        </button>
      </a>
   </div>
 </div>
</body>
</html>
